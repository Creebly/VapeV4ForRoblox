name: Build fork runtime
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/build.yaml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fork-runtime
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/build.cjs
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime NewMainScript.lua
          if ! git diff --cached --quiet; then
            git commit -m "Build fork runtime"
            git push
          fi
